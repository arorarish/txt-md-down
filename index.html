<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TextDrop — Save Text Instantly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      /* Light mode — warm paper & sepia (calm stationery) */
      --bg-primary: #f7f3ec;     /* ivory paper */
      --bg-secondary: #fdfbf7;   /* cards / inputs */
      --bg-tertiary: #efe8db;    /* raised surfaces, hovers */
      --bg-card: #fdfbf7;
      --text-primary: #3a322a;   /* warm brown-black ink */
      --text-secondary: #756b5c;
      --text-tertiary: #a99d8b;
      --heading-color: #2a241d;
      --border-color: #e7ddcd;   /* warm hairline */
      --border-light: #f0e8d9;
      --accent-color: #8a6d4f;   /* sepia / taupe */
      --accent-hover: #74583e;
      --accent-light: #ece1d2;   /* soft focus tint */
      --toggle-active: #8a6d4f;
      --btn-text: #fdfbf7;       /* cream on accent */
      --delete-color: #a8584f;   /* faded brick */
      --delete-hover: #8f463e;
      --success-color: #6f8f6a;
      --shadow-sm: 0 1px 2px 0 rgb(74 58 40 / 0.04);
      --shadow-md: 0 4px 6px -1px rgb(74 58 40 / 0.06), 0 2px 4px -2px rgb(74 58 40 / 0.05);
      --shadow-lg: 0 10px 20px -4px rgb(74 58 40 / 0.08), 0 4px 6px -4px rgb(74 58 40 / 0.05);
    }

    body.dark-mode {
      --bg-primary: #0f0f10;
      --bg-secondary: #1a1a1c;
      --bg-tertiary: #27272a;
      --bg-card: #1a1a1c;
      --text-primary: #e5e5ea;
      --text-secondary: #9e9ea2;
      --text-tertiary: #6d6d73;
      --heading-color: #606060;
      --border-color: #30303a;
      --border-light: #42424c;
      --accent-color: #1c1c1c;
      --accent-hover: #2a2a2a;
      --accent-light: #1e3a8a;
      --toggle-active: #101010;
      --btn-text: #676767;
      --delete-color: #ef4444;
      --delete-hover: #f87171;
      --success-color: #10b981;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.2);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.2), 0 2px 4px -2px rgb(0 0 0 / 0.2);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.2);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      margin: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Sidebar */
    .sidebar {
      width: 340px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      z-index: 100;
    }

    .sidebar.hidden {
      margin-left: -340px;
    }

    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand h2 {
      margin: 0;
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-optical-sizing: auto;
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .theme-toggle {
      background: transparent;
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      padding: 0;
      cursor: pointer;
      color: var(--text-tertiary);
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    .theme-toggle svg {
      width: 17px;
      height: 17px;
    }

    .theme-toggle .icon-sun { display: none; }
    body.dark-mode .theme-toggle .icon-moon { display: none; }
    body.dark-mode .theme-toggle .icon-sun { display: block; }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-color);
      background: var(--bg-secondary);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      opacity: 0.4;
      pointer-events: none;
      color: var(--text-secondary);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
    }

    .clear-all-btn {
      width: 100%;
      background: transparent;
      color: var(--text-tertiary);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .clear-all-btn:hover {
      background: var(--bg-tertiary);
      color: var(--delete-color);
    }

    /* File Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-light);
    }

    .card .title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .card .meta {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .card .snippet {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .card-actions button {
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .card-actions button:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* 'View' is the primary action — emphasised by weight, not colour */
    .btn-view {
      color: var(--text-primary);
      font-weight: 600;
    }

    .btn-view:hover {
      background: var(--accent-light);
      color: var(--accent-hover);
    }

    /* Delete stays quiet until you reach for it */
    .btn-delete {
      color: var(--text-tertiary);
    }

    .btn-delete:hover {
      background: transparent;
      color: var(--delete-color);
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 32px 32px 24px;
      overflow-y: auto;
      min-height: 0;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* Slim writing toolbar (replaces the form chrome) */
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filename-input {
      flex: 1 1 200px;
      min-width: 0;
    }

    /* Serif wordmark — the title shown in writing/focus mode.
       Hidden when the sidebar (which carries the brand) is open. */
    .wordmark {
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-optical-sizing: auto;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--heading-color);
      white-space: nowrap;
      margin-right: 4px;
      user-select: none;
    }

    body:not(.sidebar-hidden) .wordmark {
      display: none;
    }

    /* Signature credit pinned at the bottom of the writing column */
    .credit {
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-tertiary);
      margin: 14px 0 0;
      letter-spacing: 0.01em;
    }

    .credit .author {
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* First-run hint — only shown on a blank slate, hidden once you engage */
    .first-hint {
      margin: -4px 0 16px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-tertiary);
    }

    .first-hint strong {
      font-weight: 600;
      color: var(--text-secondary);
    }

    .first-hint kbd {
      font-family: inherit;
      font-size: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 1px 6px;
      color: var(--text-secondary);
    }

    body.hide-hint .first-hint {
      display: none;
    }

    .container h1 {
      margin: 0 0 6px 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--heading-color);
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    input[type="text"],
    textarea {
      width: 100%;
      font-family: inherit;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      transition: all 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    textarea {
      resize: none;
      flex: 1;
      min-height: 180px;
      line-height: 1.8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 4px 2px;
    }

    /* Borderless writing surface: no focus box, just text on the page */
    textarea:focus {
      outline: none;
      border: none;
      box-shadow: none;
    }

    /* Toggle Switch */
    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-container {
      position: relative;
      width: 140px;
      height: 44px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      padding: 4px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .toggle-slider {
      position: absolute;
      width: 66px;
      height: 36px;
      background: var(--toggle-active);
      border-radius: 10px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-md);
    }

    .toggle-slider.md {
      transform: translateX(68px);
    }

    .toggle-option {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      z-index: 1;
      transition: color 0.3s;
      padding: 10px;
    }

    .toggle-option.active {
      color: var(--btn-text);
    }

    .toggle-option.inactive {
      color: var(--text-tertiary);
    }

    /* Preview Toggle — sliding pill, matching the format toggle's motion */
    .preview-toggle {
      position: relative;
      display: flex;
      gap: 0;
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border-color);
    }

    .preview-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 72px;
      height: calc(100% - 6px);
      background: var(--bg-secondary);
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .preview-slider.preview {
      transform: translateX(72px);
    }

    .preview-toggle button {
      position: relative;
      z-index: 1;
      width: 72px;
      padding: 6px 0;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.2s ease;
    }

    .preview-toggle button.active {
      color: var(--text-primary);
    }

    .preview-toggle button:hover:not(.active) {
      color: var(--text-primary);
    }

    /* Content form-group grows to fill all available vertical space */
    .form-group-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-bottom: 16px;
    }

    .content-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .label-row label {
      margin-bottom: 0;
    }

    /* Markdown Preview */
    .preview-container {
      display: none;
      width: 100%;
      flex: 1;
      min-height: 0;
      padding: 4px 2px;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.8;
      overflow-y: auto;
      user-select: text;
    }

    .preview-container.visible {
      display: block;
    }

    .preview-container:empty::before {
      content: 'Nothing to preview...';
      color: var(--text-tertiary);
      font-style: italic;
    }

    /* Markdown rendered styles */
    .preview-container h1 {
      font-size: 1.8em;
      font-weight: 700;
      margin: 0 0 0.6em 0;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border-color);
      color: var(--heading-color);
    }

    .preview-container h2 {
      font-size: 1.4em;
      font-weight: 600;
      margin: 1.2em 0 0.5em 0;
      padding-bottom: 0.2em;
      border-bottom: 1px solid var(--border-color);
      color: var(--heading-color);
    }

    .preview-container h3 {
      font-size: 1.2em;
      font-weight: 600;
      margin: 1em 0 0.4em 0;
      color: var(--heading-color);
    }

    .preview-container p {
      margin: 0 0 1em 0;
    }

    .preview-container ul, .preview-container ol {
      margin: 0 0 1em 0;
      padding-left: 1.5em;
    }

    .preview-container li {
      margin-bottom: 0.25em;
      line-height: 1.55;
    }

    .preview-container code {
      background: var(--bg-tertiary);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 0.9em;
    }

    .preview-container pre {
      background: var(--bg-tertiary);
      padding: 12px 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0 0 1em 0;
    }

    .preview-container pre code {
      background: none;
      padding: 0;
    }

    .preview-container blockquote {
      margin: 0 0 1em 0;
      padding: 0.5em 0 0.5em 1em;
      border-left: 3px solid var(--accent-color);
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      border-radius: 0 6px 6px 0;
    }

    .preview-container strong {
      font-weight: 600;
    }

    .preview-container a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .preview-container a:hover {
      text-decoration: underline;
    }

    .preview-container hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 1.5em 0;
    }

    textarea.hidden-for-preview {
      display: none;
    }

    /* Download Button */
    .download-btn {
      width: 100%;
      background: var(--accent-color);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      box-shadow: var(--shadow-md);
    }

    .download-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-tertiary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-state-text {
      font-size: 14px;
      line-height: 1.5;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }

    /* Sidebar collapse button (inside header) */
    .sidebar-collapse {
      background: transparent;
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-tertiary);
      transition: all 0.15s;
    }

    .sidebar-collapse:hover {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    .sidebar-collapse svg {
      width: 18px;
      height: 18px;
    }

    /* Floating expand button (only visible when sidebar hidden) */
    .sidebar-expand {
      position: fixed;
      top: 20px;
      left: 16px;
      z-index: 101;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-expand:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .sidebar-expand:focus {
      outline: none;
    }

    .sidebar-expand svg {
      width: 18px;
      height: 18px;
    }

    body.sidebar-hidden .sidebar-expand {
      display: flex;
    }

    /* Focus Mode - reduced distraction */
    body.focus-mode label,
    body.focus-mode .subtitle {
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    body.focus-mode .form-group:hover label {
      opacity: 1;
    }

    body.focus-mode .btn-edit,
    body.focus-mode .btn-download,
    body.focus-mode .btn-delete,
    body.focus-mode .clear-all-btn,
    body.focus-mode .theme-toggle {
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    body.focus-mode button:hover {
      opacity: 1;
    }

    /* Main content centering when sidebar is hidden */
    body.sidebar-hidden .main {
      padding: 48px 32px;
    }

    body.sidebar-hidden .container {
      max-width: 760px;
    }

    /* Focus (zen) writing mode — a true blank page, toggled with Cmd+.
       Uses CSS overrides only, so it never disturbs the saved sidebar state. */
    /* Focus-mode control — a clearly visible dot that expands to a
       labelled pill on hover (and stays labelled while in focus mode). */
    .focus-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 9px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--text-secondary);
      cursor: pointer;
      z-index: 200;
      transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .focus-btn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-tertiary);
      box-shadow: 0 0 0 4px var(--bg-tertiary);
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .focus-btn .focus-label {
      font-size: 12px;
      font-weight: 500;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width 0.25s ease, opacity 0.2s ease;
    }

    .focus-btn .focus-label::after { content: 'Focus'; }
    body.zen-mode .focus-btn .focus-label::after { content: 'Exit focus'; }

    .focus-btn:hover {
      background: var(--bg-secondary);
      border-color: var(--border-color);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .focus-btn:hover .dot {
      background: var(--accent-color);
      box-shadow: none;
    }

    .focus-btn:hover .focus-label {
      max-width: 90px;
      opacity: 1;
    }

    /* While in focus mode the pill stays fully legible — your way back out */
    body.zen-mode .focus-btn {
      background: var(--bg-secondary);
      border-color: var(--border-color);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    body.zen-mode .focus-btn .dot {
      background: var(--accent-color);
      box-shadow: none;
    }

    body.zen-mode .focus-btn .focus-label {
      max-width: 90px;
      opacity: 1;
    }

    body.zen-mode .sidebar,
    body.zen-mode .sidebar-expand,
    body.zen-mode .editor-toolbar,
    body.zen-mode .first-hint,
    body.zen-mode .download-btn,
    body.zen-mode .credit {
      display: none;
    }

    body.zen-mode .main {
      padding: 56px 32px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 280px;
      }

      .sidebar.hidden {
        margin-left: -280px;
      }

      .main {
        padding: 24px 16px;
      }

      .container h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <!-- Floating expand button (only visible when sidebar hidden) -->
  <button class="sidebar-expand" id="sidebarExpand" title="Show sidebar (Cmd+\)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </button>
  <button class="focus-btn" id="zenDot" title="Focus mode (⌘.)" aria-label="Toggle focus writing mode">
    <span class="dot"></span>
    <span class="focus-label"></span>
  </button>
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <h2>TextDrop</h2>
        <div style="display: flex; gap: 4px;">
          <button class="theme-toggle" id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button class="sidebar-collapse" id="sidebarCollapse" title="Hide sidebar (Cmd+\)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Search files...">
      </div>
    </div>
    <div class="sidebar-content">
      <div id="fileList"></div>
    </div>
    <div class="sidebar-footer">
      <button class="clear-all-btn" id="clearAll">Clear All Files</button>
    </div>
  </div>

  <div class="main">
    <div class="container">
      <div class="editor-toolbar">
        <span class="wordmark">TextDrop</span>
        <input type="text" id="filename" class="filename-input" placeholder="Untitled" aria-label="File name">
        <div class="toggle-container" id="formatToggle" title="File format">
          <div class="toggle-slider" id="toggleSlider"></div>
          <div class="toggle-option active" data-format="txt" title="Plain text file">.txt</div>
          <div class="toggle-option inactive" data-format="md" title="Markdown — formatted text">.md</div>
        </div>
        <div class="preview-toggle" id="previewToggle">
          <div class="preview-slider" id="previewSlider"></div>
          <button class="active" data-mode="write" title="Write your text">Write</button>
          <button data-mode="preview" title="See it formatted">Preview</button>
        </div>
      </div>

      <p class="first-hint" id="firstHint">Type or paste anything below, then <strong>Save</strong>. Press <kbd>⌘.</kbd> for distraction-free focus.</p>

      <div class="form-group form-group-content">
        <div class="content-wrapper">
          <textarea id="content" placeholder="Start writing…"></textarea>
          <div class="preview-container" id="previewContainer"></div>
        </div>
      </div>

      <button class="download-btn" id="download">Save</button>
      <p class="credit">Made by <span class="author">Rishabh A</span></p>
    </div>
  </div>

  <script>
    const storageKey = 'savedFiles';
    let currentFormat = 'txt';
    let allFiles = [];
    let editingId = null;

    function getFiles() {
      return JSON.parse(localStorage.getItem(storageKey) || '[]');
    }

    function saveFileMeta(meta) {
      const files = getFiles();
      meta.id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
      files.push(meta);
      localStorage.setItem(storageKey, JSON.stringify(files));
    }

    function deleteFile(id) {
      const files = getFiles().filter(f => f.id !== id);
      localStorage.setItem(storageKey, JSON.stringify(files));
      loadAndRenderFiles();
    }

    function clearAllFiles() {
      if (confirm('Are you sure you want to delete all saved files? This cannot be undone.')) {
        localStorage.setItem(storageKey, JSON.stringify([]));
        loadAndRenderFiles();
      }
    }

    function redownloadFile(file) {
      const blob = new Blob([file.content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = file.filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function editFile(file) {
      editingId = file.id;
      document.getElementById('filename').value = file.filename.replace(/\.(txt|md)$/, '');
      document.getElementById('content').value = file.content;
      const ext = file.filename.match(/\.(txt|md)$/);
      if (ext) {
        setFormat(ext[1]);
      }
      document.getElementById('download').textContent = 'Save Changes';
      document.getElementById('content').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setFormat(format) {
      currentFormat = format;
      const slider = document.getElementById('toggleSlider');
      const options = document.querySelectorAll('.toggle-option');

      if (format === 'md') {
        slider.classList.add('md');
      } else {
        slider.classList.remove('md');
      }

      options.forEach(opt => {
        if (opt.dataset.format === format) {
          opt.classList.add('active');
          opt.classList.remove('inactive');
        } else {
          opt.classList.remove('active');
          opt.classList.add('inactive');
        }
      });
    }

    function loadAndRenderFiles() {
      allFiles = getFiles().sort((a, b) => b.timestamp - a.timestamp);
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      renderList(searchTerm);
    }

    function renderList(searchTerm = '') {
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '';

      const filteredFiles = searchTerm
        ? allFiles.filter(f =>
            f.filename.toLowerCase().includes(searchTerm) ||
            f.snippet.toLowerCase().includes(searchTerm)
          )
        : allFiles;

      if (filteredFiles.length === 0) {
        const isEmpty = allFiles.length === 0;
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${isEmpty ? '📄' : '🔍'}</div>
            <div class="empty-state-text">
              ${isEmpty ? 'No files saved yet<br>Start by pasting some text!' : 'No files found<br>Try a different search'}
            </div>
          </div>
        `;
        return;
      }

      filteredFiles.forEach(file => {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = file.filename;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = new Date(file.timestamp).toLocaleString();

        const snippet = document.createElement('div');
        snippet.className = 'snippet';
        snippet.textContent = file.snippet;

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const viewBtn = document.createElement('button');
        viewBtn.className = 'btn-view';
        viewBtn.textContent = 'View';
        viewBtn.addEventListener('click', () => {
          const blob = new Blob([file.content], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          window.open(url, '_blank');
          URL.revokeObjectURL(url);
        });

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => editFile(file));

        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'btn-download';
        downloadBtn.textContent = 'Download';
        downloadBtn.addEventListener('click', () => redownloadFile(file));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          if (confirm(`Delete "${file.filename}"?`)) {
            deleteFile(file.id);
          }
        });

        actions.appendChild(viewBtn);
        actions.appendChild(editBtn);
        actions.appendChild(downloadBtn);
        actions.appendChild(deleteBtn);

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(snippet);
        card.appendChild(actions);
        listEl.appendChild(card);
      });
    }

    // Simple markdown parser
    function parseMarkdown(text) {
      if (!text.trim()) return '';

      let html = text;

      // Escape HTML to prevent XSS
      html = html.replace(/&/g, '&amp;')
                 .replace(/</g, '&lt;')
                 .replace(/>/g, '&gt;');

      // Code blocks (```code```) - must be before other parsing
      html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

      // Inline code (`code`)
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headers
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // Bold and italic
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
      html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
      html = html.replace(/_(.+?)_/g, '<em>$1</em>');

      // Blockquotes
      html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

      // Horizontal rule
      html = html.replace(/^---$/gm, '<hr>');
      html = html.replace(/^\*\*\*$/gm, '<hr>');

      // Lists — tag unordered and ordered items distinctly, then wrap each
      // consecutive run in the right container so ordered items keep numbers.
      html = html.replace(/^[\-\*] (.+)$/gm, '<li data-ul>$1</li>');
      html = html.replace(/^\d+\. (.+)$/gm, '<li data-ol>$1</li>');
      html = html.replace(/(?:<li data-ul>.*?<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
      html = html.replace(/(?:<li data-ol>.*?<\/li>\n?)+/g, m => '<ol>' + m + '</ol>');
      html = html.replace(/<li data-(?:ul|ol)>/g, '<li>');

      // Links [text](url)
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // Line breaks - convert double newlines to paragraphs
      const blocks = html.split(/\n\n+/);
      html = blocks.map(block => {
        block = block.trim();
        if (!block) return '';
        // Don't wrap if already wrapped in block element
        if (/^<(h[1-6]|ul|ol|li|pre|blockquote|hr)/.test(block)) {
          return block;
        }
        // Convert single newlines to <br> within paragraphs
        return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');

      // Clean up empty paragraphs
      html = html.replace(/<p><\/p>/g, '');
      html = html.replace(/<p>(<(h[1-6]|ul|ol|pre|blockquote|hr)[^>]*>)/g, '$1');
      html = html.replace(/(<\/(h[1-6]|ul|ol|pre|blockquote|hr)>)<\/p>/g, '$1');

      // Remove stray <br> tags around list elements. The paragraph pass turns
      // the single newlines between list items into <br>, which renders as big
      // gaps between bullets — strip those so lists stay tight.
      html = html.replace(/<br>\s*(<\/?(?:ul|ol|li)\b[^>]*>)/g, '$1');
      html = html.replace(/(<\/?(?:ul|ol|li)\b[^>]*>)\s*<br>/g, '$1');

      return html;
    }

    // Preview mode state
    let isPreviewMode = false;

    function updatePreview() {
      const content = document.getElementById('content').value;
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = parseMarkdown(content);
    }

    function setPreviewMode(mode) {
      const textarea = document.getElementById('content');
      const previewContainer = document.getElementById('previewContainer');
      const buttons = document.querySelectorAll('#previewToggle button');

      isPreviewMode = mode === 'preview';

      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      const slider = document.getElementById('previewSlider');
      if (slider) slider.classList.toggle('preview', isPreviewMode);

      if (isPreviewMode) {
        updatePreview();
        textarea.classList.add('hidden-for-preview');
        previewContainer.classList.add('visible');
      } else {
        textarea.classList.remove('hidden-for-preview');
        previewContainer.classList.remove('visible');
        textarea.focus();
      }
    }

    // Preview toggle buttons
    document.querySelectorAll('#previewToggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        setPreviewMode(btn.dataset.mode);
      });
    });

    // Format toggle
    document.querySelectorAll('.toggle-option').forEach(option => {
      option.addEventListener('click', () => {
        setFormat(option.dataset.format);
      });
    });

    // Download button
    document.getElementById('download').addEventListener('click', function() {
      const content = document.getElementById('content').value;
      if (!content) {
        alert('Please enter some content first!');
        return;
      }

      let filename = document.getElementById('filename').value.trim() || 'untitled';
      if (!filename.endsWith('.' + currentFormat)) {
        filename += '.' + currentFormat;
      }

      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      const snippet = content.substring(0, 80).replace(/\n/g, ' ');

      if (editingId) {
        // Editing an existing note — update it in place instead of copying
        const files = getFiles();
        const idx = files.findIndex(f => f.id === editingId);
        if (idx !== -1) {
          files[idx] = { ...files[idx], filename, snippet, content, timestamp: Date.now() };
          localStorage.setItem(storageKey, JSON.stringify(files));
        } else {
          saveFileMeta({ filename, snippet, content, timestamp: Date.now() });
        }
      } else {
        saveFileMeta({ filename, snippet, content, timestamp: Date.now() });
      }
      loadAndRenderFiles();

      // Reset edit state, clear, reset preview mode, and focus
      editingId = null;
      document.getElementById('download').textContent = 'Save';
      document.getElementById('content').value = '';
      document.getElementById('filename').value = '';
      setPreviewMode('write');
      document.getElementById('content').focus();
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderList(e.target.value.toLowerCase());
    });

    // Dismiss the first-run hint as soon as the user starts writing
    document.getElementById('content').addEventListener('input', () => {
      document.body.classList.add('hide-hint');
    });

    // Theme toggle with system preference detection
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
      }
    }

    document.getElementById('themeToggle').addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    document.getElementById('clearAll').addEventListener('click', clearAllFiles);

    // Sidebar toggle with localStorage persistence
    function initSidebarState() {
      const savedState = localStorage.getItem('sidebarVisible');
      const shouldHide = savedState === 'false';
      const sidebar = document.querySelector('.sidebar');

      if (shouldHide) {
        sidebar.classList.add('hidden');
        document.body.classList.add('focus-mode');
        document.body.classList.add('sidebar-hidden');
      }
    }

    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const isHidden = sidebar.classList.contains('hidden');

      sidebar.classList.toggle('hidden');
      document.body.classList.toggle('focus-mode');
      document.body.classList.toggle('sidebar-hidden');

      localStorage.setItem('sidebarVisible', isHidden);
    }

    document.getElementById('sidebarCollapse').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarExpand').addEventListener('click', toggleSidebar);

    // Focus (zen) writing mode — hide all chrome, just text on the page
    function toggleZen(force) {
      const on = typeof force === 'boolean' ? force : !document.body.classList.contains('zen-mode');
      document.body.classList.toggle('zen-mode', on);
      if (on && !isPreviewMode) {
        document.getElementById('content').focus();
      }
    }

    document.getElementById('zenDot').addEventListener('click', () => toggleZen());

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl + S to download
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        document.getElementById('download').click();
      }
      // Cmd/Ctrl + K to focus search
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      // Cmd/Ctrl + \ to toggle sidebar
      if ((e.metaKey || e.ctrlKey) && e.key === '\\') {
        e.preventDefault();
        toggleSidebar();
      }
      // Cmd/Ctrl + P to toggle preview
      if ((e.metaKey || e.ctrlKey) && e.key === 'p') {
        e.preventDefault();
        setPreviewMode(isPreviewMode ? 'write' : 'preview');
      }
      // Cmd/Ctrl + . to toggle focus (zen) writing mode
      if ((e.metaKey || e.ctrlKey) && e.key === '.') {
        e.preventDefault();
        toggleZen();
      }
      // Esc exits focus mode
      if (e.key === 'Escape' && document.body.classList.contains('zen-mode')) {
        e.preventDefault();
        toggleZen(false);
      }
    });

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initSidebarState();
      loadAndRenderFiles();
      // First-run hint only on a truly blank slate (no saved files yet)
      if (getFiles().length > 0) {
        document.body.classList.add('hide-hint');
      }
      document.getElementById('content').focus();
    });
  </script>
</body>
</html>
